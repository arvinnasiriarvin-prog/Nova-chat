<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta name="google-site-verification" content="45-gadL4Exf_zvj-zgFZc1zJLKYOXZ7_v3jl9aa9R7E" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071827">
<title>INOW CHAT</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Tahoma,sans-serif;
 background:#071827;
 color:#ecfaff;
 height:100vh;
 display:flex;
 overflow:hidden;
}

.sidebar{
 width:250px;
 background:#0b2234;
 border-left:1px solid #17465b;
 padding:18px;
 display:flex;
 flex-direction:column;
 gap:15px;
}

.logo{
 font-size:25px;
 font-weight:bold;
 color:#20d6d2;
 text-align:center;
 padding:12px;
}

.new-chat{
 background:linear-gradient(135deg,#20d6d2,#38bdf8);
 color:#062333;
 border:0;
 border-radius:12px;
 padding:14px;
 font-weight:bold;
 cursor:pointer;
}

.side-title{
 color:#81b9c8;
 font-size:13px;
 margin-top:15px;
}

.history-item{
 background:#102f43;
 padding:12px;
 border-radius:10px;
 color:#d8f5fa;
 font-size:13px;
}

.main{
 flex:1;
 display:flex;
 flex-direction:column;
 min-width:0;
}

header{
 height:70px;
 background:#0b2234;
 border-bottom:1px solid #17465b;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 22px;
}

.brand{
 color:#20d6d2;
 font-size:21px;
 font-weight:bold;
}

.status{
 color:#8bd9df;
 font-size:12px;
}

.welcome{
 text-align:center;
 margin:35px 15px 15px;
}

.welcome h1{
 color:#20d6d2;
 font-size:27px;
}

.welcome p{
 color:#9bc5d3;
 line-height:2;
}

#messages{
 flex:1;
 overflow-y:auto;
 padding:20px;
}

.message{
 padding:14px 17px;
 margin:12px 0;
 border-radius:15px;
 max-width:85%;
 line-height:2;
 overflow-wrap:anywhere;
 white-space:pre-wrap;
}

.user{
 background:#087f91;
 margin-right:auto;
}

.bot{
 background:#102f43;
 border:1px solid #17465b;
 margin-left:auto;
}

footer{
 padding:15px;
 background:#0b2234;
 display:flex;
 gap:10px;
 border-top:1px solid #17465b;
}

input{
 flex:1;
 min-width:0;
 padding:15px;
 border:1px solid #246176;
 border-radius:13px;
 background:#102f43;
 color:white;
 outline:none;
 font-family:Tahoma;
}

input:focus{
 border-color:#20d6d2;
}

.send{
 background:#20d6d2;
 color:#062333;
 border:0;
 border-radius:13px;
 padding:12px 22px;
 font-weight:bold;
 cursor:pointer;
}

.clear{
 background:#18394d;
 color:#9bd9e4;
 border:0;
 border-radius:10px;
 padding:11px;
 cursor:pointer;
}

button:active{opacity:.8}

@media(max-width:650px){
 .sidebar{width:75px;padding:10px}
 .logo{font-size:15px;padding:10px 0}
 .new-chat{font-size:11px;padding:12px 4px}
 .side-title,.history-item{display:none}
 header{padding:0 12px}
 .message{max-width:95%}
 .welcome h1{font-size:23px}
 footer{padding:10px}
 .send{padding:10px 14px}
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">✦ INOW</div>

 <button class="new-chat" onclick="newChat()">
 ＋ گفتگوی جدید
 </button>

 <div class="side-title">گفتگوی فعلی</div>
 <div class="history-item">💬 گفتگوی من با آینو</div>

 <div style="margin-top:auto">
 <button class="clear" onclick="clearHistory()">
 🗑 پاک کردن گفتگو
 </button>
 </div>
</aside>

<main class="main">

<header>
 <div class="brand">INOW CHAT</div>
 <div class="status">● نسخه آزمایشی</div>
</header>

<div class="welcome" id="welcome">
 <h1>سلام! من آینو هستم ✨</h1>
 <p>
 به دنیای INOW خوش اومدی.<br>
 چطور می‌تونم امروز کمکت کنم؟
 </p>
</div>

<div id="messages"></div>

<footer>
 <input id="input" placeholder="پیامت رو برای آینو بنویس..." autocomplete="off">
 <button class="send" onclick="sendMessage()">ارسال</button>
</footer>

</main>

<script>
const box=document.getElementById("messages");
const input=document.getElementById("input");
const welcome=document.getElementById("welcome");
const STORAGE_KEY="inow_chat_history";

let history=[];

function saveHistory(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(history));
 }catch(e){}
}

function addMessage(type,text){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}

function loadHistory(){
 try{
  history=JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
  if(!Array.isArray(history))history=[];
 }catch(e){history=[]}

 if(history.length===0){
  history=[{
   type:"bot",
   text:"سلام! من آینو هستم. چطور می‌تونم کمکت کنم؟ ✨"
  }];
  saveHistory();
 }

 history.forEach(m=>addMessage(m.type,m.text));
}

function normalize(text){
 return text
 .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/ي/g,"ی")
 .replace(/ك/g,"ک")
 .trim()
 .toLowerCase();
}

function calculate(raw){
 let expression=raw
 .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/×/g,"*")
 .replace(/÷/g,"/")
 .replace(/,/g,".");

 expression=expression
 .replace(/^(حساب کن|محاسبه کن|جواب)\s*/,"")
 .trim();

 if(!/^[0-9+\-*/().%\s.]+$/.test(expression))return null;

 try{
  const result=Function('"use strict";return ('+expression+')')();
  if(typeof result!=="number"||!Number.isFinite(result))return null;
  return "جواب محاسبه: "+Number(result.toFixed(8));
 }catch(e){return null}
}

function getAnswer(raw){
 const text=normalize(raw);

 if(/^(سلام|درود|hi|hello)/.test(text))
 return "سلام! خوش اومدی! ✨ چه کاری از دستم برمیاد؟";

 if(text.includes("خوبی")||text.includes("حالت چطوره"))
 return "ممنون که پرسیدی! من آماده‌ام کمکت کنم. تو چطوری؟ 😊";

 if(text.includes("اسم")&&(text.includes("تو")||text.includes("چیه")))
 return "اسم من INOW هست؛ دستیار هوشمند تو! 🤖";

 if(text.includes("ممنون")||text.includes("مرسی"))
 return "خواهش می‌کنم! هر وقت کمکی خواستی من آماده‌ام. 🌟";

 if(text.includes("خداحافظ")||text.includes("فعلا"))
 return "فعلاً! امیدوارم روز خوبی داشته باشی. 👋";

 if(text.includes("چه کار")&&text.includes("میتونی"))
 return "می‌تونم در محاسبات ساده، احوال‌پرسی و راهنمایی‌های اولیه کمکت کنم.";

 if(/[0-9۰-۹]/.test(raw)){
  const result=calculate(raw);
  if(result)return result;
 }

 if(text.includes("هوش مصنوعی"))
 return "هوش مصنوعی فناوری‌ایه که به کامپیوترها کمک می‌کنه کارهایی مثل تحلیل اطلاعات و پاسخ‌گویی رو انجام بدن.";

 if(text.includes("کمک"))
 return "حتماً! سؤالت رو واضح برام بنویس تا راهنمایی‌ات کنم. 😊";

 return "سؤال جالبیه! هنوز مغز هوش مصنوعی آنلاین به من متصل نشده. این قابلیت در مراحل بعدی اضافه می‌شه. 🧠";
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;

 welcome.style.display="none";

 history.push({type:"user",text});
 addMessage("user",text);

 const answer=getAnswer(text);

 history.push({type:"bot",text:answer});
 addMessage("bot",answer);

 saveHistory();
 input.value="";
}

function clearHistory(){
 if(!confirm("تمام گفتگوها پاک بشن؟"))return;
 newChat();
}

function newChat(){
 history=[{
  type:"bot",
  text:"سلام! من آینو هستم. چطور می‌تونم کمکت کنم؟ ✨"
 }];

 box.innerHTML="";
 addMessage("bot",history[0].text);
 saveHistory();
 welcome.style.display="block";
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

loadHistory();
</script>

</body>
</html>
