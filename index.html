<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101020">
<title>INOW CHAT</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,sans-serif;
 background:#101020;
 color:white;
 display:flex;
 flex-direction:column;
 height:100vh;
}
header{
 background:#211b42;
 padding:18px;
 text-align:center;
 font-size:25px;
 font-weight:bold;
 color:#b99aff;
}
#clear{
 margin:10px;
 background:#a33b55;
}
#messages{
 flex:1;
 overflow:auto;
 padding:15px;
}
.message{
 padding:13px;
 margin:10px 0;
 border-radius:15px;
 max-width:85%;
 line-height:1.8;
 overflow-wrap:anywhere;
}
.user{background:#6846b9;margin-right:auto}
.bot{background:#292943;margin-left:auto}
footer{
 display:flex;
 padding:12px;
 gap:8px;
 background:#211b42;
}
input{
 flex:1;
 min-width:0;
 padding:14px;
 border:0;
 border-radius:12px;
 background:#34344c;
 color:white;
 outline:none;
}
button{
 background:#8055e8;
 color:white;
 border:0;
 border-radius:12px;
 padding:12px 18px;
}
</style>
</head>

<body>

<header>✨ INOW CHAT</header>

<button id="clear" onclick="clearHistory()">پاک کردن تاریخچه گفتگو</button>

<div id="messages"></div>

<footer>
<input id="input" placeholder="پیامت رو بنویس..." autocomplete="off">
<button onclick="sendMessage()">ارسال</button>
</footer>

<script>
const box = document.getElementById("messages");
const input = document.getElementById("input");
const STORAGE_KEY = "inow_chat_history";

let history = [];

function saveHistory(){
 try{
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
 }catch(error){
  alert("ذخیره تاریخچه امکان‌پذیر نیست.");
 }
}

function addMessage(type, text){
 const message = document.createElement("div");
 message.className = "message " + type;
 message.textContent = text;
 box.appendChild(message);
 box.scrollTop = box.scrollHeight;
}

function loadHistory(){
 try{
  history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  if(!Array.isArray(history)) history = [];
 }catch(error){
  history = [];
 }

 if(history.length === 0){
  history = [{
   type:"bot",
   text:"سلام! من آینو هستم. به INOW CHAT خوش اومدی! ✨"
  }];
  saveHistory();
 }

 history.forEach(item => addMessage(item.type, item.text));
}

function sendMessage(){
 const text = input.value.trim();
 if(!text) return;

 history.push({type:"user", text:text});
 addMessage("user", text);

 const answer = "پیامت دریافت شد! برای پاسخ هوشمند باید مغز هوش مصنوعی به سرور متصل شود.";

 history.push({type:"bot", text:answer});
 addMessage("bot", answer);

 saveHistory();
 input.value = "";
}

function clearHistory(){
 if(!confirm("مطمئنی می‌خوای تمام گفتگوها پاک بشن؟")) return;

 history = [{
  type:"bot",
  text:"سلام! من آینو هستم. به INOW CHAT خوش اومدی! ✨"
 }];

 saveHistory();
 box.innerHTML = "";
 addMessage("bot", history[0].text);
}

input.addEventListener("keydown", function(event){
 if(event.key === "Enter") sendMessage();
});

loadHistory();
</script>

</body>
</html>
